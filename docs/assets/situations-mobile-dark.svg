<svg xmlns="http://www.w3.org/2000/svg" width="480" height="820" viewBox="0 0 480 820" role="img" aria-labelledby="title desc">
<title id="title">Use the tools you have</title>
<desc id="desc">Default routing before worker calls: check required tools, model access and allowed usage. Prefer Codex and Claude Code when both are eligible. If the other provider is unavailable, use two distinct eligible models in the starting provider. Without a reviewer, continue in the current chat with a provisional plan and self-critique; independent review is missing. The starting chat coordinates. Explicit provider, model, advice-only and wait choices take priority.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#ed9278" stroke-width="1.5"/></marker></defs>
<rect x=".5" y=".5" width="479" height="819" rx="12" fill="#161b22" stroke="#30363d"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<text x="24" y="46" font-size="28" fill="#f0f3f6" font-weight="600" text-anchor="start">Use the tools you have</text>
<text x="24" y="81" font-size="20" fill="#b1bac4" font-weight="400" text-anchor="start">Your starting chat coordinates.</text>
<text x="24" y="120" font-size="18" fill="#b1bac4" font-weight="400" text-anchor="start">Checks tools, model access and</text>
<text x="24" y="145" font-size="18" fill="#b1bac4" font-weight="400" text-anchor="start">allowed usage before worker calls.</text>
<path d="M24 167H456" stroke="#30363d"/>
<text x="24" y="207" font-size="20" fill="#ed9278" font-weight="600" text-anchor="start">01</text><text x="66" y="207" font-size="24" fill="#f0f3f6" font-weight="600" text-anchor="start">Both providers available</text>
<rect x="24" y="230" width="184" height="56" rx="8" fill="#21262d" stroke="#89939f"/><rect x="272" y="230" width="184" height="56" rx="8" fill="#21262d" stroke="#89939f"/><text x="116" y="266" font-size="22" fill="#f0f3f6" font-weight="600" text-anchor="middle">Codex</text><text x="364" y="266" font-size="22" fill="#f0f3f6" font-weight="600" text-anchor="middle">Claude Code</text><path d="M225 258H255" stroke="#ed9278" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="24" y="318" font-size="18" fill="#b1bac4" font-weight="400" text-anchor="start">Planning and review across providers</text>
<path d="M24 347H456" stroke="#30363d"/>
<text x="24" y="387" font-size="20" fill="#ed9278" font-weight="600" text-anchor="start">02</text><text x="66" y="387" font-size="24" fill="#f0f3f6" font-weight="600" text-anchor="start">One provider available</text>
<rect x="24" y="410" width="184" height="56" rx="8" fill="#21262d" stroke="#89939f"/><rect x="272" y="410" width="184" height="56" rx="8" fill="#21262d" stroke="#89939f"/><text x="116" y="446" font-size="22" fill="#f0f3f6" font-weight="600" text-anchor="middle">Planner model</text><text x="364" y="446" font-size="22" fill="#f0f3f6" font-weight="600" text-anchor="middle">Critic model</text><path d="M225 438H255" stroke="#ed9278" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="24" y="499" font-size="18" fill="#b1bac4" font-weight="400" text-anchor="start">Two distinct models in Codex or Claude Code</text>
<path d="M24 527H456" stroke="#30363d"/>
<text x="24" y="567" font-size="20" fill="#ed9278" font-weight="600" text-anchor="start">03</text><text x="66" y="567" font-size="24" fill="#f0f3f6" font-weight="600" text-anchor="start">No reviewer available</text>
<rect x="24" y="590" width="432" height="93" rx="8" fill="#21262d" stroke="#89939f"/>
<text x="44" y="627" font-size="23" fill="#f0f3f6" font-weight="600" text-anchor="start">Provisional plan + self-critique</text>
<text x="44" y="656" font-size="18" fill="#b1bac4" font-weight="400" text-anchor="start">Current chat · No independent review</text>
<text x="24" y="733" font-size="20" fill="#b1bac4" font-weight="400" text-anchor="start">Your choices take priority.</text>
<text x="24" y="765" font-size="20" fill="#b1bac4" font-weight="400" text-anchor="start">“Wait for both” saves progress</text>
<text x="24" y="797" font-size="20" fill="#b1bac4" font-weight="400" text-anchor="start">and waits.</text>
</g>
</svg>
