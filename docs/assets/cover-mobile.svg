<svg xmlns="http://www.w3.org/2000/svg" width="480" height="254" viewBox="0 0 480 254" role="img" aria-labelledby="title desc">
  <title id="title">Codex–Claude Council — Two perspectives. One clearer plan.</title>
  <desc id="desc">A compact ink-colored banner with teal and terracotta accents for Codex and Claude.</desc>
  <rect x="1" y="1" width="478" height="252" rx="18" fill="#142a2f" stroke="#29484d" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="28" y="28" width="6" height="16" rx="3" fill="#64c5b3"/>
    <rect x="39" y="28" width="6" height="16" rx="3" fill="#e0a085"/>
    <text x="57" y="42" font-size="16" font-weight="600" letter-spacing="1.4" fill="#c0d1d1">CODEX–CLAUDE COUNCIL</text>
    <text x="27" y="108" font-size="43" font-weight="600" letter-spacing="-1.2" fill="#fbfaf6">Two perspectives.</text>
    <text x="27" y="163" font-size="43" font-weight="600" letter-spacing="-1.2" fill="#fbfaf6">One clearer plan.</text>
    <text x="29" y="216" font-size="20" fill="#b6cbcc">Plan with intent. Review with evidence.</text>
  </g>
</svg>
