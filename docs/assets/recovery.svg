<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">Recover without resetting the task limits</title>
<desc id="desc">When the opposite provider is blocked during a run, inspect the cause and preserve successful reports, original participant identities and spent allowance. If distinct eligible models in the current provider and known authorized residual limits fit the full requested workflow, permit one linked same-provider run; completion is not guaranteed. Otherwise deliver a provisional plan with self-critique, or checkpoint if the chat cannot continue. Explicit wait or both-required requests, and exhausted overall allowance, require a checkpoint. No paid bypass, allowance reset or chained transition. A timeout alone is not proof of exhausted quota.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#b63827" stroke-width="1.5"/></marker></defs>
<rect width="960" height="790" fill="#f7f4ed"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#202820">
<text x="40" y="54" font-size="32" font-weight="600" fill="#202820" text-anchor="start">Other provider blocked during a run</text>
<text x="40" y="93" font-size="23" font-weight="400" fill="#5d554d" text-anchor="start">Confirm the cause. A timeout alone does not prove quota exhaustion.</text>
<rect x="180" y="125" width="600" height="99" rx="6" fill="#eae5da"/>
<text x="480" y="163" font-size="27" font-weight="600" fill="#202820" text-anchor="middle">Pause blocked calls. Keep progress.</text>
<text x="480" y="199" font-size="22" font-weight="400" fill="#202820" text-anchor="middle">Saved reports + identities + consumed allowance</text>
<path d="M480 224V267" fill="none" stroke="#b63827" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="151" y="278" width="658" height="123" rx="6" fill="none" stroke="#202820" stroke-width="1.5"/>
<text x="480" y="317" font-size="25" font-weight="600" fill="#202820" text-anchor="middle">Distinct eligible models in the current provider?</text>
<text x="480" y="354" font-size="24" font-weight="400" fill="#202820" text-anchor="middle">Full workflow fits authorized remaining limits?</text>
<text x="480" y="386" font-size="21" font-weight="400" fill="#5d554d" text-anchor="middle">Both checks must pass before another worker call.</text>
<path d="M480 401V433H248V484" fill="none" stroke="#b63827" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M480 433H712V484" fill="none" stroke="#b63827" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="176" y="442" width="143" height="30" rx="6" fill="#f7f4ed"/>
<text x="248" y="465" font-size="22" font-weight="600" fill="#b63827" text-anchor="middle">YES</text>
<rect x="620" y="442" width="184" height="30" rx="6" fill="#f7f4ed"/>
<text x="712" y="465" font-size="22" font-weight="600" fill="#b63827" text-anchor="middle">NO / UNKNOWN</text>
<rect x="40" y="497" width="416" height="127" rx="6" fill="none" stroke="#202820" stroke-width="1.5"/>
<text x="64" y="535" font-size="26" font-weight="600" fill="#202820" text-anchor="start">One linked same-provider run</text>
<text x="64" y="571" font-size="22" font-weight="400" fill="#202820" text-anchor="start">Real critique + verification requested</text>
<text x="64" y="604" font-size="21" font-weight="400" fill="#5d554d" text-anchor="start">Within the residual task budget</text>
<rect x="504" y="497" width="416" height="127" rx="6" fill="#eae5da"/>
<text x="528" y="535" font-size="26" font-weight="600" fill="#202820" text-anchor="start">Provisional plan + self-critique</text>
<text x="528" y="571" font-size="22" font-weight="400" fill="#202820" text-anchor="start">Missing independent review stays clear.</text>
<text x="528" y="604" font-size="21" font-weight="400" fill="#5d554d" text-anchor="start">Checkpoint if the chat cannot continue</text>
<path d="M24 654H936" stroke="#d4cebf"/>
<text x="40" y="695" font-size="22" font-weight="600" fill="#202820" text-anchor="start">Wait / both required / overall limit hit</text>
<path d="M455 687H502" fill="none" stroke="#b63827" stroke-width="2" marker-end="url(#arrow)"/>
<text x="524" y="695" font-size="23" font-weight="600" fill="#202820" text-anchor="start">Save a checkpoint</text>
<text x="40" y="746" font-size="22" font-weight="400" fill="#5d554d" text-anchor="start">No paid bypass · No budget reset · No chained transitions</text>
</g>
</svg>

