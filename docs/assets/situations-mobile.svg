<text x="44" y="813" font-size="24" font-weight="400" fill="#202820" text-anchor="start">+ current-chat self-critique</text>
<text x="44" y="846" font-size="21" font-weight="400" fill="#5d554d" text-anchor="start">No independent review</text>
<text x="24" y="925" font-size="22" font-weight="400" fill="#5d554d" text-anchor="start">Explicit choices override routing.</text>
