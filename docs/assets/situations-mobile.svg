<text x="366" y="329" font-size="24" font-weight="600" fill="#202820" text-anchor="middle">Claude Code</text>
<path d="M222 319H258" fill="none" stroke="#b63827" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="24" y="389" font-size="22" font-weight="400" fill="#5d554d" text-anchor="start">Planning author + planning reviewer</text>
<path d="M24 421H456" stroke="#d4cebf"/>
<text x="24" y="473" font-size="22" font-weight="600" fill="#b63827" text-anchor="start">02</text>
<text x="67" y="473" font-size="27" font-weight="600" fill="#202820" text-anchor="start">Other unavailable</text>
<rect x="24" y="500" width="179" height="91" rx="6" fill="none" stroke="#202820" stroke-width="1.5"/>
<rect x="277" y="500" width="179" height="91" rx="6" fill="none" stroke="#202820" stroke-width="1.5"/>
<text x="113" y="538" font-size="25" font-weight="600" fill="#202820" text-anchor="middle">Planner</text>
<text x="113" y="569" font-size="24" font-weight="400" fill="#202820" text-anchor="middle">model</text>
<text x="366" y="538" font-size="25" font-weight="600" fill="#202820" text-anchor="middle">Coding</text>
<text x="366" y="569" font-size="24" font-weight="400" fill="#202820" text-anchor="middle">critic</text>
<path d="M222 545H258" fill="none" stroke="#b63827" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
