<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">Codex–Claude Council: independent planning workflow</title>
  <desc id="workflow-description">In independent plan mode, an evidence-based project assessment and clear direction inform separate Codex and Claude proposals. Both agents review the other's proposal. The coordinating chat synthesizes the plan with a security review and acceptance checks. The peer verifies it. The final plan records decisions and retains unresolved questions. The numbered flow reads left to right across the top, then right to left across the bottom. The diagram shows separate viewpoints, not concurrent execution or completed implementation tests.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#7b918d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="576" rx="20" fill="#f5f7f5"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="41" fill="#596c70" font-size="16" font-weight="600" letter-spacing="2">CODEX × CLAUDE</text>
    <rect x="690" y="20" width="238" height="32" rx="16" fill="#e7ece9"/>
    <text x="809" y="41" text-anchor="middle" fill="#435c58" font-size="15" font-weight="600" letter-spacing="1.2">INDEPENDENT PLAN MODE</text>
    <text x="32" y="93" fill="#14252b" font-size="34" font-weight="600" letter-spacing="-0.7">Two perspectives. One actionable plan.</text>

    <g fill="none" stroke="#7b918d" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M 246 232 H 277"/>
      <path d="M 605 232 H 636"/>
      <path d="M 786 320 V 357"/>
      <path d="M 644 454 H 613"/>
      <path d="M 338 454 H 307"/>
    </g>

    <g fill="#ffffff" stroke="#d4ddda" stroke-width="1.2">
      <rect x="32" y="138" width="214" height="182" rx="12"/>
      <rect x="285" y="138" width="320" height="182" rx="12"/>
      <rect x="644" y="138" width="284" height="182" rx="12"/>
      <rect x="644" y="365" width="284" height="179" rx="12"/>
      <rect x="338" y="365" width="267" height="179" rx="12"/>
    </g>
    <rect x="32" y="365" width="267" height="179" rx="12" fill="#e8f1ec" stroke="#adc9bc" stroke-width="1.2"/>

    <g fill="#596c70" font-size="15" font-weight="600" letter-spacing="1.5">
      <text x="54" y="170">01 / CONTEXT</text>
      <text x="307" y="170">02 / PROPOSALS</text>
      <text x="666" y="170">03 / CRITIQUE</text>
      <text x="666" y="397">04 / SYNTHESIS</text>
      <text x="360" y="397">05 / VERIFICATION</text>
      <text x="54" y="397" fill="#3d6253">06 / DELIVERABLE</text>
    </g>

    <g fill="#14252b" font-size="26" font-weight="600" letter-spacing="-0.4">
      <text x="54" y="212">Project state</text>
      <text x="307" y="212" font-size="24">Independent proposals</text>
      <text x="666" y="212">Cross-review</text>
      <text x="666" y="439">Coordinator plan</text>
      <text x="360" y="439">Peer verification</text>
      <text x="54" y="439">One final plan</text>
    </g>

    <g fill="#596c70" font-size="21">
      <text x="54" y="253">Evidence + scope</text>
      <text x="54" y="283">Clear direction</text>
      <text x="666" y="253">Both agents critique</text>
      <text x="666" y="283">the other's proposal</text>
      <text x="666" y="480">Security review</text>
      <text x="666" y="510">+ acceptance checks</text>
      <text x="360" y="480">Challenges the plan</text>
      <text x="360" y="510">and remaining gaps</text>
      <text x="54" y="480" fill="#3d6253">Decisions recorded</text>
      <text x="54" y="510" fill="#3d6253" font-size="20">Open questions retained</text>
    </g>

    <rect x="307" y="236" width="130" height="60" rx="8" fill="#e6f1ed"/>
    <rect x="451" y="236" width="132" height="60" rx="8" fill="#f7ece6"/>
    <text x="372" y="275" text-anchor="middle" fill="#0d7a73" font-size="25" font-weight="600">Codex</text>
    <text x="517" y="275" text-anchor="middle" fill="#a05238" font-size="25" font-weight="600">Claude</text>
  </g>
</svg>
